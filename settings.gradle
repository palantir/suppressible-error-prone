buildscript {
    repositories {
        mavenCentral() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
        gradlePluginPortal() { metadataSources { mavenPom(); ignoreGradleMetadataRedirection() } }
    }
    dependencies {
        classpath 'com.palantir.gradle.jdks:gradle-jdks-settings:0.65.0'
    }
}
apply plugin: 'com.palantir.jdks.settings'

rootProject.name = "suppressible-error-prone-root"

include 'gradle-suppressible-error-prone'
include 'gradle-suppressible-error-prone:test-error-prone-checks'
include 'suppressible-error-prone'
