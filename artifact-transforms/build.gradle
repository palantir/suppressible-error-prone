plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.palantir.suppressible-error-prone'
version = '0.0.1'

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.ow2.asm:asm:9.9.1'

    implementation(gradleApi())
}
