buildscript {
    dependencies {
        classpath 'com.palantir.suppressible-error-prone:artifact-transforms'
    }
}

plugins {
    id 'java-library'
    id 'com.palantir.external-publish-jar'
}

dependencies {
    // Add dependency on artifact-transforms to get access to ModifyErrorProneCheckApi
    implementation 'com.palantir.suppressible-error-prone:artifact-transforms'

    implementation 'com.google.errorprone:error_prone_annotation'
    implementation 'com.google.errorprone:error_prone_check_api'
    implementation 'com.google.errorprone:error_prone_core'
    implementation 'one.util:streamex'

    annotationProcessor 'com.google.auto.service:auto-service'
    compileOnly 'com.google.auto.service:auto-service'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.errorprone:error_prone_test_helpers'
    testImplementation 'org.assertj:assertj-core'
}

moduleJvmArgs {
    opens 'java.base/java.util'
    exports('jdk.compiler/com.sun.tools.javac.api',
            'jdk.compiler/com.sun.tools.javac.comp',
            'jdk.compiler/com.sun.tools.javac.file',
            'jdk.compiler/com.sun.tools.javac.main',
            'jdk.compiler/com.sun.tools.javac.parser',
            'jdk.compiler/com.sun.tools.javac.tree',
            'jdk.compiler/com.sun.tools.javac.util')
}

// This project uses baseline-error-prone during compilation tasks. baseline-error-prone brings in
// suppressible-error-prone. In gradle-suppressible-error-prone, we set up an artifact transform
// that transforms every dependency in the `annotationProcessor` configurations, including the
// suppressible-error-prone brought in by baseline-error-prone. Without the change below, Gradle
// thinks that the suppressible-error-prone requested is the same as this project, and tried to
// use the project version as an input to the artifact transform. This leads to an irresolvable
// circular dependency, where in order to compile the suppressible-error-prone, we need to already
// have the compiled jar. So instead, we change the group of this project to have `-internal` on
// the end (but make sure that we use the correct groupId in publishing) so Gradle doesn't think
// that the suppressible-error-prone dep is the same as this project.
def originalGroup = project.group
project.group = originalGroup + '-internal'

publishing {
    publications.withType(MavenPublication).configureEach {
        groupId = originalGroup
    }
}

tasks.withType(JavaCompile) {
    options.errorprone {
        disable('StrictUnusedVariable', 'PreferSafeLoggableExceptions')
    }
}

// Register artifact transform to make Error Prone's Replacement record non-final
// so that LazySuppressionReplacement can extend it
import com.palantir.suppressibleerrorprone.transform.ModifyErrorProneCheckApi
import com.palantir.suppressibleerrorprone.transform.ModifiedFile

def ARTIFACT_TRANSFORM_APPLIED = Attribute.of('com.palantir.suppressible-error-prone.transform-applied', Boolean)

// Set default value for jar artifacts
dependencies.artifactTypes.getByName('jar').attributes.attribute(ARTIFACT_TRANSFORM_APPLIED, false)

dependencies.registerTransform(ModifyErrorProneCheckApi) { TransformSpec transform ->
    transform.from
        .attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.JAR_TYPE)
        .attribute(ARTIFACT_TRANSFORM_APPLIED, false)
    transform.to
        .attribute(ArtifactTypeDefinition.ARTIFACT_TYPE_ATTRIBUTE, ArtifactTypeDefinition.JAR_TYPE)
        .attribute(ARTIFACT_TRANSFORM_APPLIED, true)
    transform.parameters { params ->
        params.filesToModify.set([ModifiedFile.REPLACEMENT] as Set)
    }
}

configurations.compileClasspath.attributes.attribute(ARTIFACT_TRANSFORM_APPLIED, true)
configurations.testCompileClasspath.attributes.attribute(ARTIFACT_TRANSFORM_APPLIED, true)
configurations.testRuntimeClasspath.attributes.attribute(ARTIFACT_TRANSFORM_APPLIED, true)
