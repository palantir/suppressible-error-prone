apply plugin: 'groovy'
apply plugin: 'java-gradle-plugin'
apply plugin: 'com.palantir.external-publish-jar'
apply plugin: 'com.palantir.gradle-plugin-testing'
apply plugin: 'com.palantir.external-publish-gradle-plugin'

configurations {
    // artifact-transforms is an included build that is not published as a separate artifact.
    // We shade its classes into the JAR (so consumers can resolve the plugin without a separate dependency)
    // and extend compile/runtime classpaths (so TestKit integration tests can load the plugin classes).
    // This configuration is not a standard dependency scope, so it won't appear in the published POM.
    shade {
        transitive = false
    }
    compileClasspath.extendsFrom shade
    runtimeClasspath.extendsFrom shade
    testCompileClasspath.extendsFrom shade
    testRuntimeClasspath.extendsFrom shade
}

dependencies {
    api 'net.ltgt.gradle:gradle-errorprone-plugin'

    implementation 'org.ow2.asm:asm'
    implementation 'com.palantir.gradle.utils:environment-variables'
    implementation 'one.util:streamex'
    implementation 'com.google.guava:guava'

    shade 'com.palantir.suppressible-error-prone.internal:artifact-transforms'

    testImplementation 'com.netflix.nebula:nebula-test'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testImplementation 'commons-io:commons-io'
    testImplementation 'one.util:streamex'
    testImplementation 'com.palantir.gradle.plugintesting:configuration-cache-spec'
    testImplementation 'com.palantir.javaformat:palantir-java-format'

    gradlePluginForTesting 'com.palantir.gradle.consistentversions:gradle-consistent-versions'
}

tasks.named('jar') {
    from(configurations.shade.collect { zipTree(it) }) {
        exclude 'META-INF/**'
    }
}

gradlePlugin {
    website = 'https://github.com/palantir/suppressible-error-prone'
    vcsUrl = 'https://github.com/palantir/suppressible-error-prone'

    plugins {
        suppressibleErrorProne {
            id = 'com.palantir.suppressible-error-prone'
            displayName = 'Suppressible Error Prone'
            description = 'Extends the Gradle Error Prone Plugin and Error Prone itself to support automatically suppressing errors.'
            tags = ['error-prone', 'javac', 'suppression']
            implementationClass = 'com.palantir.gradle.suppressibleerrorprone.SuppressibleErrorPronePlugin'
        }
    }
}

test {
    systemProperty 'ignoreDeprecations', 'true'
    systemProperty 'projectVersion', project.version
}

// Added as a jar the errorprone configuration inside the plugin, so in nebula-tests needs to exist in maven local
tasks.test.dependsOn tasks.findByPath(':suppressible-error-prone:publishToMavenLocal')
tasks.test.dependsOn tasks.findByPath(':test-error-prone-checks:publishToMavenLocal')
tasks.test.dependsOn gradle.includedBuild('artifact-transforms').task(':publishToMavenLocal')

tasks.withType(JavaCompile) {
    options.errorprone {
        disable('StrictUnusedVariable')
    }
}

gradleTestUtils {
    configurationCacheEnabled = true
}

moduleJvmArgs {
    // Need so that debugging testkit gradle runs with configuration cache works
    opens 'java.base/java.util', 'java.base/java.lang.invoke'
}
